<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1F3864">
<title>BECO · Descargas Parciales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BECO DP">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1F3864;--navy2:#2E5E9E;--navy-light:#D5E8F0;
  --bg:#F4F3F0;--surface:#FFFFFF;--surface2:#F8F8F6;
  --text:#0B0B0B;--text2:#52514E;--text3:#898781;
  --border:#E1E0D9;--border2:#C3C2B7;
  --danger-bg:#FCEBEB;--danger-text:#791F1F;--danger-border:#F09595;
  --warn-bg:#FAEEDA;--warn-text:#633806;--warn-border:#EF9F27;
  --ok-bg:#EAF3DE;--ok-text:#27500A;--ok-border:#97C459;
  --accent-bg:#E6F1FB;--accent-text:#0C447C;
  --radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.hidden{display:none!important}

/* ── Acceso (login + PIN) ── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem 1.75rem;width:100%;max-width:400px;text-align:center}
.gate-logo{width:76px;height:76px;object-fit:contain;margin-bottom:.75rem}
.gate-title{font-size:18px;font-weight:700;color:var(--navy)}
.gate-sub{font-size:12px;color:var(--text3);margin:.25rem 0 1.5rem}
.ms-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border2);border-radius:var(--radius);padding:10px 18px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text)}
.ms-btn:hover{border-color:var(--navy2)}
.ms-btn svg{width:18px;height:18px}
.pin-input{width:100%;font-size:26px;letter-spacing:.5em;text-align:center;padding:10px;border:1.5px solid var(--border2);border-radius:var(--radius);font-family:'Courier New',monospace;outline:none;margin:.5rem 0 .75rem}
.pin-input:focus{border-color:var(--navy2)}
.btn-primary{width:100%;padding:11px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:var(--navy2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.gate-msg{font-size:12px;margin-top:.875rem;min-height:18px;color:var(--text2)}
.gate-msg.err{color:var(--danger-text)}
.gate-user{font-size:12px;color:var(--text2);margin-bottom:.75rem}
.link-btn{background:none;border:none;color:var(--navy2);font-size:12px;cursor:pointer;font-family:inherit;margin-top:.75rem;text-decoration:underline}

/* ── Header ── */
.corp-header{background:var(--navy)}
.corp-header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:.75rem 1.5rem;gap:12px}
.corp-brand{display:flex;align-items:center;gap:12px;min-width:0}
.corp-logo{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex-shrink:0}
.corp-logo-text{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.corp-logo-sub{color:#85B7EB;font-size:11px;margin-top:1px}
.corp-right{display:flex;align-items:center;gap:14px}
.corp-meta{display:flex;flex-direction:column;align-items:flex-end}
.corp-meta-label{color:#85B7EB;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.corp-meta-value{color:#fff;font-size:13px;font-weight:500}
.hdr-btn{padding:5px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.85);font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.1);color:#fff}

/* ── Nav ── */
.nav-bar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-bar-inner{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.nav-tab{padding:14px 18px;font-size:13px;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.nav-tab:hover{color:var(--navy)}
.nav-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.camp-sel{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);white-space:nowrap}
.camp-sel select{padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius);font-family:inherit;font-size:12px;color:var(--navy);font-weight:600;background:#fff;cursor:pointer}

/* ── Content ── */
.content{max-width:1200px;margin:0 auto;padding:1.5rem}
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.875rem;padding-bottom:6px;border-bottom:2px solid var(--navy-light)}
.sec-title span{color:var(--navy)}
.intro-box{background:var(--surface);border-left:4px solid var(--navy);border-radius:0 var(--radius) var(--radius) 0;padding:.875rem 1rem;font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:1.5rem}
.notice{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);border-radius:var(--radius);padding:.625rem .875rem;font-size:12px;margin-bottom:1rem}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:4rem 1rem;color:var(--text3);font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--navy2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
.badge-ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-border)}
.badge-accent{background:var(--accent-bg);color:var(--accent-text)}
.badge-muted{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}

.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:1.5rem}
.gen-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.gen-card:hover{border-color:var(--navy2);box-shadow:0 0 0 3px var(--navy-light)}
.gen-card-header{background:var(--navy);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between}
.gen-card-title{color:#fff;font-size:14px;font-weight:600}
.gen-card-body{padding:.875rem 1rem}
.gen-stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.gen-stat-row:last-child{border-bottom:none}
.gen-stat-label{color:var(--text2)}
.gen-stat-val{font-weight:600;font-variant-numeric:tabular-nums}
.gen-card-footer{padding:.625rem 1rem;background:var(--surface2);border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.5}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem}
.chart-legend{display:flex;gap:16px;margin-bottom:.75rem;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.leg-swatch{width:16px;height:3px;border-radius:2px}
.chart-wrap{position:relative;width:100%}

.summary-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto;margin-bottom:1.5rem}
.summary-table{width:100%;border-collapse:collapse;font-size:12px}
.summary-table th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:500;font-size:11px;white-space:nowrap}
.summary-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2)}
.summary-table tr:last-child td{border-bottom:none}
.summary-table td:first-child{font-weight:600;color:var(--text);white-space:nowrap}
.comment-box{background:var(--navy-light);border:1px solid var(--navy2);border-radius:var(--radius);padding:.875rem 1rem;font-size:13px;color:var(--accent-text);line-height:1.65;margin-bottom:1.5rem}
.comment-box strong{color:var(--navy)}

.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--navy2);cursor:pointer;background:none;border:none;padding:0 0 1rem;font-family:inherit}
.gen-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.5rem}
.gen-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .875rem}
.gen-kpi.highlight{border-color:var(--navy2);background:var(--accent-bg)}
.gen-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.gen-kpi-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.gen-kpi-unit{font-size:11px;font-weight:400;color:var(--text3)}
.gen-kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
.filter-label{font-size:11px;color:var(--text3);margin-right:2px}
.f-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.f-btn.active{border-color:var(--navy);background:var(--navy);color:#fff}
.f-sep{width:1px;height:18px;background:var(--border2);margin:0 4px}

.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:1.25rem}
.analysis-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.analysis-card-header{background:var(--navy);padding:.625rem 1rem;font-size:12px;font-weight:600;color:#fff;display:flex;justify-content:space-between}
.analysis-card-body{padding:.875rem 1rem;overflow-x:auto}
.a-row{padding:6px 0;border-bottom:1px solid var(--border)}
.a-row:last-child{border-bottom:none}
.a-fase{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.a-text{font-size:12px;color:var(--text2);line-height:1.55}
.a-detail{display:flex;gap:10px;margin-top:3px;flex-wrap:wrap}
.a-detail span{font-size:11px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:4px}
.a-empty{font-size:12px;color:var(--text3);font-style:italic;padding:.5rem 0}
.pol-table,.sys-table{width:100%;border-collapse:collapse;font-size:12px}
.pol-table th,.sys-table th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-bottom:1px solid var(--border);text-align:left}
.pol-table td,.sys-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text2)}
.pol-table tr:last-child td,.sys-table tr:last-child td{border-bottom:none}
.ratio-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-block}
.ratio-high{background:var(--danger-bg);color:var(--danger-text)}
.ratio-mid{background:var(--warn-bg);color:var(--warn-text)}
.ratio-low{background:var(--ok-bg);color:var(--ok-text)}
.acciones-list{list-style:none}
.acciones-list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.acciones-list li:last-child{border-bottom:none}
.acc-num{font-weight:700;color:var(--navy);min-width:16px}
.cmp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem}
.cmp-sum{font-size:12px;color:var(--text2);margin-bottom:.75rem;line-height:1.6}
.cmp-sum b{color:var(--navy)}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.cmp-table th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.cmp-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.cmp-table tr:last-child td{border-bottom:none}
.dl{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;margin-left:4px}
.dl-n{background:var(--surface2);color:var(--text3)}
.dl-ok{background:var(--ok-bg);color:var(--ok-text)}
.dl-w{background:var(--warn-bg);color:var(--warn-text)}
.dl-d{background:var(--danger-bg);color:var(--danger-text)}
.cmp-note{font-size:11px;color:var(--text3);margin-top:.625rem}
.iris-list{display:flex;flex-direction:column;gap:6px}
.iris-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px}
.iris-row.actual{border-color:var(--navy2);background:var(--accent-bg)}
.iris-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--navy2);background:#fff;color:var(--navy);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.iris-btn:hover{background:var(--navy);color:#fff}
.iris-miss{font-size:11px;color:var(--text3);font-style:italic;white-space:nowrap}

@media(max-width:700px){
  .corp-header-inner,.nav-bar-inner,.content{padding-left:1rem;padding-right:1rem}
  .corp-logo-sub,.corp-meta{display:none}
  .nav-bar-inner{flex-wrap:wrap;padding-top:6px}
  .nav-tab{padding:12px 10px;font-size:12px}
}
</style>
</head>
<body>

<!-- ══ ACCESO ══ -->
<div id="gate">
  <div class="gate-card">
    <img class="gate-logo" id="gate-logo" alt="BECO">
    <div class="gate-title">Descargas Parciales</div>
    <div class="gate-sub">Seguimiento en línea · IRIS Power / IEEE 1434<br>Acceso exclusivo para supervisores</div>

    <div id="step-login">
      <button class="ms-btn" onclick="loginMS()">
        <svg viewBox="0 0 21 21"><rect width="10" height="10" fill="#f25022"/><rect x="11" width="10" height="10" fill="#7fba00"/><rect y="11" width="10" height="10" fill="#00a4ef"/><rect x="11" y="11" width="10" height="10" fill="#ffb900"/></svg>
        Iniciar sesión con Microsoft
      </button>
    </div>

    <div id="step-pin" class="hidden">
      <div class="gate-user" id="gate-user"></div>
      <input type="password" class="pin-input" id="pin" inputmode="numeric" maxlength="8" autocomplete="off"
             onkeydown="if(event.key==='Enter')validarPIN()">
      <button class="btn-primary" id="pin-btn" onclick="validarPIN()">Entrar</button>
      <button class="link-btn" onclick="logout()">Usar otra cuenta</button>
    </div>

    <div class="gate-msg" id="gate-msg"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="hidden">
  <header class="corp-header">
    <div class="corp-header-inner">
      <div class="corp-brand">
        <img class="corp-logo" id="hdr-logo" alt="BECO">
        <div>
          <div class="corp-logo-text">Bijao Electric Company S.A. de C.V.</div>
          <div class="corp-logo-sub">Seguimiento de Descargas Parciales en Línea — IRIS Power / IEEE 1434</div>
        </div>
      </div>
      <div class="corp-right">
        <div class="corp-meta">
          <div class="corp-meta-label">Lectura mostrada</div>
          <div class="corp-meta-value" id="hdr-fecha">—</div>
        </div>
        <button class="hdr-btn" onclick="recargar()" title="Volver a leer OneDrive">⟳ Recargar</button>
        <button class="hdr-btn" onclick="logout()">Salir</button>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="nav-bar-inner">
      <div class="nav-tabs">
        <button class="nav-tab active" id="tab-home" onclick="showHome()">Resumen general</button>
        <button class="nav-tab" id="tab-g1" onclick="showGen(1)">Generador 1</button>
        <button class="nav-tab" id="tab-g2" onclick="showGen(2)">Generador 2</button>
        <button class="nav-tab" id="tab-g3" onclick="showGen(3)">Generador 3</button>
      </div>
      <label class="camp-sel">Lectura
        <select id="sel-camp" onchange="cambiarCampana(this.value)"></select>
      </label>
    </div>
  </nav>

  <main class="content">
    <div id="screen-loading" class="loading"><div class="spinner"></div>Leyendo campañas desde OneDrive…</div>
    <div id="screen-home" class="hidden"></div>
    <div id="screen-g1" class="hidden"></div>
    <div id="screen-g2" class="hidden"></div>
    <div id="screen-g3" class="hidden"></div>
  </main>
</div>

<script>
// ════════════════════════════════════════════════════════════

let msalApp = null, account = null, CONFIG = null;

function gateMsg(t, err){ const m=document.getElementById('gate-msg'); m.textContent=t||''; m.className='gate-msg'+(err?' err':''); }

async function initMsal(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:CLIENT_ID, authority:`https://login.microsoftonline.com/${TENANT_ID}`,
           redirectUri: APP_URL },
    cache:{ cacheLocation:'localStorage' }
  });
  await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise();
  account = resp?.account || msalApp.getAllAccounts()[0] || null;
  if (account) msalApp.setActiveAccount(account);
}

async function getToken(){
  try {
    return (await msalApp.acquireTokenSilent({ scopes:SCOPES, account })).accessToken;
  } catch(e) {
    await msalApp.acquireTokenRedirect({ scopes:SCOPES });
  }
}

function loginMS(){ msalApp.loginRedirect({ scopes:SCOPES, prompt:'select_account' }); }

function logout(){
  sessionStorage.removeItem(PIN_KEY);
  if (account) msalApp.logoutRedirect({ account, postLogoutRedirectUri: APP_URL });
  else location.reload();
}

function dominioValido(acc){ return (acc?.username||'').toLowerCase().endsWith('@'+DOMINIO); }

async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function validarPIN(){
  const btn = document.getElementById('pin-btn');
  const pin = document.getElementById('pin').value.trim();
  if (!pin) return;
  btn.disabled = true; gateMsg('Verificando…');
  try {
    if (!CONFIG) CONFIG = await leerJSON('config/acceso.json');
    if (!CONFIG) throw new Error('No se encontró config/acceso.json en OneDrive.');
    if (await sha256(pin) !== CONFIG.pin_sha256) {
      gateMsg('PIN incorrecto.', true); document.getElementById('pin').value=''; return;
    }
    sessionStorage.setItem(PIN_KEY, account.username);
    entrarApp();
  } catch(e) {
    gateMsg(e.message, true);
  } finally { btn.disabled = false; }
}

function mostrarGate(){
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  if (!account) {
    document.getElementById('step-login').classList.remove('hidden');
    document.getElementById('step-pin').classList.add('hidden');
    return;
  }
  if (!dominioValido(account)) {
    document.getElementById('step-login').classList.remove('hidden');
    document.getElementById('step-pin').classList.add('hidden');
    gateMsg(`La cuenta ${account.username} no pertenece a @${DOMINIO}.`, true);
    return;
  }
  document.getElementById('step-login').classList.add('hidden');
  document.getElementById('step-pin').classList.remove('hidden');
  document.getElementById('gate-user').textContent = '✉ ' + account.username;
  setTimeout(()=>document.getElementById('pin').focus(), 50);
}

// ONEDRIVE (Graph)
// ════════════════════════════════════════════════════════════
const itemUrl = p => `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/${BASE_PATH}/${p}`;

async function graphGet(url){
  const r = await fetch(url, { headers:{ Authorization:'Bearer '+await getToken() } });
  if (r.status === 404) return null;                       // no existe → null
  if (!r.ok) throw new Error(`OneDrive respondió ${r.status} al leer ${url.split('root:/')[1]||url}`);
  return r.json();
}

// Lee un JSON. Devuelve null SOLO si no existe; cualquier otro error se lanza.
async function leerJSON(path){
  const meta = await graphGet(itemUrl(path));
  if (!meta) return null;
  return descargarJSON(meta['@microsoft.graph.downloadUrl'], path);
}

async function descargarJSON(url, nombre){
  const r = await fetch(url);
  if (!r.ok) throw new Error('No se pudo descargar ' + nombre);
  try { return await r.json(); } catch { throw new Error(nombre + ' no es un JSON válido.'); }
}

async function listarHijos(path){
  const out = []; let url = itemUrl(path) + ':/children?$top=200';
  while (url) {
    const d = await graphGet(url);
    if (!d) return null;
    out.push(...d.value); url = d['@odata.nextLink'] || null;
  }
  return out;
}

let CAMPANAS = [];      // [{k, lectura, analisis, archivos:{nombre:item}}] ordenado asc
let SEL = null;         // campaña seleccionada (k)
let AVISOS = [];

async function cargarCampanas(){
  AVISOS = [];
  const carpetas = await listarHijos('campanas');
  if (!carpetas) throw new Error('No se encontró la carpeta campanas/ en OneDrive.');
  const ks = carpetas.filter(c => c.folder && /^\d{4}-\d{2}$/.test(c.name)).map(c => c.name).sort();

  const res = await Promise.all(ks.map(async k => {
    const items = await listarHijos('campanas/' + k) || [];
    const archivos = Object.fromEntries(items.filter(i=>i.file).map(i => [i.name, i]));
    const lItem = archivos['lectura.json'], aItem = archivos['analisis.json'];
    if (!lItem) { AVISOS.push(`La campaña ${k} no tiene lectura.json y se omitió.`); return null; }
    const lectura  = await descargarJSON(lItem['@microsoft.graph.downloadUrl'], k+'/lectura.json');
    const analisis = aItem ? await descargarJSON(aItem['@microsoft.graph.downloadUrl'], k+'/analisis.json') : null;
    return { k, lectura, analisis, archivos };
  }));
  CAMPANAS = res.filter(Boolean);
  if (!CAMPANAS.length) throw new Error('No hay campañas con lectura.json en OneDrive.');
}

const camp     = k => CAMPANAS.find(c => c.k === k);
const etiqueta = c => c.lectura.etiqueta || c.k;
const lecGen   = (c, g) => c?.lectura?.generadores?.[g] || null;
const anGen    = (c, g) => c?.analisis?.generadores?.[g] || null;

// Última campaña <= SEL donde el generador fue medido
function campanaGen(g, hasta = SEL){
  for (let i = CAMPANAS.length - 1; i >= 0; i--) {
    const c = CAMPANAS[i];
    if (c.k <= hasta && lecGen(c, g)) return c;
  }
  return null;
}

function fechaLarga(c){
  const f = c.lectura.fecha_lectura;
  if (!f || c.lectura.fecha_exacta === false) return etiqueta(c);
  const [y,m,d] = f.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('es-HN', { day:'numeric', month:'long', year:'numeric' });
}

function ratio(qp, qm){ return (qp != null && qm) ? qp / qm : null; }

  dC('chartHome');

function serieGen(g){
  // Puntos del generador hasta la campaña seleccionada
  return CAMPANAS.filter(c => c.k <= SEL && lecGen(c, g)).map(c => ({ c, L: lecGen(c, g) }));
}

// Plugin: escribe el valor encima de cada punto (solo cuando hay pocas líneas, para que se lea)
const valueLabels = {
  id:'valueLabels',
  afterDatasetsDraw(chart, _a, opt){
    if (!opt?.enabled) return;
    const ctx = chart.ctx; ctx.save();
    ctx.font = '600 10px -apple-system,Segoe UI,Arial,sans-serif'; ctx.textAlign = 'center';
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i); if (meta.hidden) return;
      const arriba = i % 2 === 0;                 // positivo arriba del punto, negativo abajo
      meta.data.forEach((pt, j) => {
        const val = ds.data[j]; if (val == null) return;
        ctx.fillStyle = ds.borderColor;
        ctx.textBaseline = arriba ? 'bottom' : 'top';
        ctx.fillText(Number(val).toLocaleString('es-HN'), pt.x, pt.y + (arriba ? -8 : 8));
      });
    });
    ctx.restore();
  }
};

function buildGenChart(g){
  const gk = 'G'+g, st = genState[g], isNQN = st.tipo === 'NQN';

  fases.forEach(f => {

    ds.push({label:lbl+st.tipo+'−', data:pts.map(p=>p.L.maquina[f][kn]??null), borderColor:cn, backgroundColor:cn+'15', borderWidth:2, cubicInterpolationMode:'monotone', spanGaps:true, pointRadius:4, pointBackgroundColor:cn, pointBorderColor:'#fff', pointBorderWidth:2});

// ════════════════════════════════════════════════════════════
// COMPARATIVA AUTOMÁTICA
// ════════════════════════════════════════════════════════════
function pct(a, b){ return (a == null || b == null || b === 0) ? null : (a - b) / b * 100; }
function mesesEntre(a, b){ const [y1,m1]=a.k.split('-').map(Number), [y2,m2]=b.k.split('-').map(Number); return (y2-y1)*12 + (m2-m1); }

// Clasifica un cambio: los aumentos preocupan; las bajas grandes se marcan en verde
function delta(actual, ref){
  const p = pct(actual, ref);
  if (p == null) return { p:null, cls:'dl-n', html:'<span class="dl dl-n">—</span>' };
  const cls = p > UMBRAL_ALTO ? 'dl-d' : p >= UMBRAL_NORMAL ? 'dl-w' : p <= -UMBRAL_NORMAL ? 'dl-ok' : 'dl-n';
  const fl = p >= 0.5 ? '▲' : p <= -0.5 ? '▼' : '=';
  return { p, cls, html:`<span class="dl ${cls}">${fl} ${p>0?'+':''}${p.toFixed(1)} %</span>` };
}

function renderComparativa(gk, cg){
  const serie = CAMPANAS.filter(c => lecGen(c, gk));
  const idx = serie.findIndex(c => c.k === cg.k);
  const prev = idx > 0 ? serie[idx-1] : null;
  const base = cg.k > BASE_K ? camp(BASE_K) : null;
  const L = lecGen(cg, gk), P = lecGen(prev, gk), B = lecGen(base, gk);
  const hist = serie.slice(0, idx);       // lecturas anteriores (para máximo histórico)

  if (!P) return `<div class="cmp-card"><div class="sec-title"><span>Comparativa automática</span></div>
    <div class="a-empty">Es la primera lectura registrada de este generador; no hay contra qué comparar.</div></div>`;

  const dT = (L.temp_estator != null && P.temp_estator != null) ? L.temp_estator - P.temp_estator : null;
  let altos = 0;
  const filas = FASES.map(f => {
    const m = L.maquina[f], mp = P.maquina[f], mb = B?.maquina[f];
    const dPrev = delta(m.qm_pos, mp.qm_pos), dBase = delta(m.qm_pos, mb?.qm_pos);
    const dNeg  = delta(m.qm_neg, mp.qm_neg), dNqn = delta(m.nqn_pos, mp.nqn_pos);
    if (dPrev.cls === 'dl-d' || dBase.cls === 'dl-d') altos++;
    const maxH = Math.max(...hist.map(c => lecGen(c, gk).maquina[f].qm_pos ?? -Infinity));
    const nuevoMax = m.qm_pos != null && hist.length && m.qm_pos > maxH;
    const r = ratio(m.qm_pos, m.qm_neg);
    return `<tr>
      <td style="font-weight:600;color:var(--navy)">Fase ${f}</td>
      <td><b>${v(m.qm_pos)}</b> mV ${nuevoMax ? '<span class="badge badge-danger" style="font-size:10px">Nuevo máximo</span>' : ''}</td>
      <td>${v(mp.qm_pos)} → ${v(m.qm_pos)} ${dPrev.html}</td>
      <td>${B ? `${v(mb.qm_pos)} → ${v(m.qm_pos)} ${dBase.html}` : '<span class="dl dl-n">—</span>'}</td>
      <td>${v(m.qm_neg)} mV ${dNeg.html}</td>
      <td>${m.nqn_pos == null ? '—' : m.nqn_pos.toLocaleString('es-HN')} ${m.nqn_pos != null && mp.nqn_pos != null ? dNqn.html : ''}</td>
      <td>${r == null ? '—' : `<span class="ratio-pill ${ratioPill(r)}">${r.toFixed(2)}</span>`}</td>
    </tr>`;
  }).join('');

  const nMes = mesesEntre(prev, cg);
  const tempTxt = dT == null ? 'Temperatura sin dato' :
    `Temperatura ${v(P.temp_estator)} → ${v(L.temp_estator)} °C (${dT>0?'+':''}${dT} °C)`;
  const tempAviso = dT != null && Math.abs(dT) > UMBRAL_TEMP
    ? `<div class="notice" style="margin:.5rem 0 .75rem">⚠ La temperatura cambió ${Math.abs(dT)} °C respecto a ${esc(etiqueta(prev))}. La comparación no es directa: el stress grading sube con la temperatura y los vacíos internos bajan.</div>` : '';

  return `<div class="cmp-card">
    <div class="sec-title"><span>Comparativa automática</span> — calculada de las lecturas</div>
    <div class="cmp-sum">Comparado contra <b>${esc(etiqueta(prev))}</b> (${nMes} ${nMes===1?'mes':'meses'} antes)${B ? ` y contra la base <b>${esc(etiqueta(base))}</b>` : ''}
      · ${tempTxt} · ${altos ? `<b style="color:var(--danger-text)">${altos} fase${altos>1?'s':''} con aumento &gt; ${UMBRAL_ALTO} %</b>` : `Ninguna fase supera +${UMBRAL_ALTO} %`}</div>
    ${tempAviso}
    <div style="overflow-x:auto"><table class="cmp-table">
      <thead><tr><th>Fase</th><th>Qm+ actual</th><th>vs anterior</th><th>vs base</th><th>Qm− (vs ant.)</th><th>NQN+ (vs ant.)</th><th>Ratio</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
    <div class="cmp-note">Gris: cambio &lt; ${UMBRAL_NORMAL} % (variación normal) · Ámbar: aumento ${UMBRAL_NORMAL}–${UMBRAL_ALTO} % · Rojo: aumento &gt; ${UMBRAL_ALTO} % · Verde: baja ≥ ${UMBRAL_NORMAL} %</div>
  </div>`;
}

function nombreIris(c, gk){ return lecGen(c, gk)?.reporte_iris || `IRIS_${gk}_${c.k}.pdf`; }

function renderIris(gk, cg){
  const serie = CAMPANAS.filter(c => lecGen(c, gk)).reverse();
  const conPdf = serie.filter(c => c.archivos[nombreIris(c, gk)]).length;
  return `<div class="analysis-card" style="margin-bottom:1.25rem">
    <div class="analysis-card-header">Reportes IRIS originales <span style="font-size:10px;opacity:.8">${conPdf} de ${serie.length} cargados</span></div>
    <div class="analysis-card-body"><div class="iris-list">
      ${serie.map(c => {
        const n = nombreIris(c, gk), ok = !!c.archivos[n];
        return `<div class="iris-row ${c.k === cg.k ? 'actual' : ''}">
          <span><b>${esc(etiqueta(c))}</b>${c.k === cg.k ? ' · lectura mostrada' : ''}<br><span style="font-size:11px;color:var(--text3)">${esc(n)}</span></span>
          ${ok ? `<button class="iris-btn" onclick="verIris('${c.k}','${esc(n)}')">Ver PDF</button>` : '<span class="iris-miss">No cargado aún</span>'}
        </div>`; }).join('')}
    </div></div></div>`;
}

async function verIris(k, nombre){
  // Se abre la pestaña de inmediato (si no, el navegador la bloquea) y luego se carga el enlace fresco
  const w = window.open('', '_blank');
  if (w) w.document.write('<p style="font-family:sans-serif;padding:2rem;color:#555">Abriendo reporte IRIS…</p>');
  try {
    const meta = await graphGet(itemUrl(`campanas/${k}/${nombre}`));
    if (!meta) throw new Error('El archivo ya no está en OneDrive.');
    const url = meta['@microsoft.graph.downloadUrl'];
    // Se descarga y se muestra como PDF en el visor del navegador
    const blob = await (await fetch(url)).blob();
    const obj = URL.createObjectURL(new Blob([blob], { type:'application/pdf' }));
    if (w) w.location.href = obj; else window.open(obj, '_blank');
  } catch(e) {
    if (w) w.close();
    alert('No se pudo abrir el reporte: ' + e.message);
  }
}

            <thead><tr><th>Fase</th><th>NQN+ / −</th><th>Qm+ / − (mV)</th><th>Estado</th><th>Interpretación</th></tr></thead>
            <tbody>${sistRows}</tbody></table>` : vacio('Esta lectura no tiene valores del Total System.')}
          <div style="margin-top:1rem;padding-top:.875rem;border-top:1px solid var(--border)">
            <div class="sec-title" style="margin-bottom:.5rem"><span>Acciones recomendadas</span></div>
            ${A?.acciones?.length
              ? `<ul class="acciones-list">${A.acciones.map((a,i) => `<li><span class="acc-num">${i+1}.</span><span>${esc(a)}</span></li>`).join('')}</ul>`
              : vacio('Sin acciones registradas.')}
          </div>
        </div>
      </div>
    </div>
    ${renderIris(gk, cg)}`;

  buildGenChart(g);
}

function setTipo(g,t){ genState[g].tipo = t; renderGen(g); }
function setFase(g,f){ genState[g].fase = f; renderGen(g); }
function setPeriodo(g,p){ genState[g].periodo = p; renderGen(g); }
